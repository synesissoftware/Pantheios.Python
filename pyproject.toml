[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=61.0",
]


[project]
authors = [
    { email = "matthew@synesis.com.au", name = "Matt Wilson" },
]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 2",
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
]
description = "Efficient, expressive, flexible diagnostic logging, for Python"
keywords = [
    "diagnostic",
    "logging",
    "pantheios",
]
license = { text = "BSD-3-Clause" }
name = "pantheios"
readme = "README.md"
requires-python = ">=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*, !=3.4.*, !=3.5.*, !=3.6.*, !=3.7.*"
version = "0.0.0"

[project.urls]
"Bug Tracker" = "https://github.com/synesissoftware/Pantheios.Python/issues"
Changelog = "https://github.com/synesissoftware/Pantheios.Python/blob/master/CHANGES.md"
Homepage = "https://github.com/synesissoftware/Pantheios.Python"
Repository = "https://github.com/synesissoftware/Pantheios.Python"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff>=0.4.0; python_version >= '3.8'",
]


[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.4.0; python_version >= '3.8'",
]

[tool.ruff]
line-length = 76
target-version = "py38"

[tool.ruff.lint]
ignore = [
    "E501",
]
select = [
    "E",
    "F",
]

[tool.setuptools.packages.find]
exclude = [
    "examples*",
    "tests*",
]
include = [
    "pantheios",
    "pantheios.*",
]
